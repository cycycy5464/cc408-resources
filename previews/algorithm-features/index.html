<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>算法五大特性 · CC408 交互预览</title><style>body{margin:0;background:#f0f4f9;font-family:system-ui,-apple-system,'Microsoft YaHei',sans-serif;color:#182437}main{max-width:880px;margin:auto;padding:32px 16px 60px}header{margin-bottom:24px}header p{color:#64748b;line-height:1.8}h1{font-size:clamp(24px,4vw,36px);letter-spacing:-.03em}.badge{color:#2364aa;font-size:12px;font-weight:700;letter-spacing:.12em}footer{margin-top:20px;color:#64748b;font-size:13px;line-height:1.8}.root { color: var(--text, #182437); border: 1px solid var(--border, #dbe3ed); border-radius: 18px; padding: clamp(14px, 3vw, 26px); background: var(--surface, #fff); overflow-wrap: anywhere; }
.eyebrow,.note,.progress { font-size: .85rem; line-height: 1.65; }
.eyebrow,.note { color: var(--text-muted, #64748b); }
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.root button { min-height: 44px; border: 1px solid var(--border, #dbe3ed); border-radius: 10px; padding: 8px 12px; color: inherit; background: transparent; font: inherit; cursor: pointer; }
.root button:focus-visible,.root [role='tabpanel']:focus-visible { outline: 3px solid #4285df; outline-offset: 3px; }
.root button:disabled { cursor: default; opacity: .5; }
.root button[aria-selected='true'],.root button[aria-pressed='true'] { background: #eaf2ff; color: #194e9b; border-color: #a7c7f2; }
.definition { font-size: 1.12rem; font-weight: 600; line-height: 1.7; margin: 22px 0 16px; }
.examples,.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.steps { list-style: none; padding: 0; margin: 20px 0; display: grid; gap: 8px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--border, #dbe3ed); border-radius: 10px; line-height: 1.6; }
.steps li > span:first-child { flex: 0 0 24px; text-align: center; font-weight: 700; }
.steps li[aria-current='step'] { border-color: #3e76bf; background: #eff6ff; color: #163b70; }
.steps li[data-complete='true'] > span:first-child { color: #12815d; }
.explanation { margin-top: 20px; padding: 16px; border-inline-start: 3px solid #4482d2; background: var(--surface-muted, #f4f7fb); border-radius: 8px; line-height: 1.75; }
.explanation p { margin: 6px 0 0; }
@media (max-width: 480px) { .tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); } .tabs button { padding-inline: 6px; } .examples button { flex: 1 1 140px; } }
</style></head><body><main><header><span class="badge">CC408 / INTERACTIVE LAB</span><h1>让算法的特性，看得见</h1><p>选择一项特性，对照两个例子。每一步都由你推进，解释始终可见。</p></header><section id="demo" class="root" aria-label="算法五大特性交互练习"></section><footer>CC408 公开教学交互预览。无需登录，不连接账号或数据库。此演示不代表 CC408 正式站点已经更新。</footer></main><script>const features=[{"id":"finite","name":"有穷性","definition":"算法必须在有限步骤内结束。","examples":[{"label":"有限循环","kind":"valid","steps":["令 i = 0，结果列表为空","i < 2：将 0 加入结果，令 i = 1","i < 2：将 1 加入结果，令 i = 2","i < 2 不成立，返回 [0, 1]"],"explanation":"循环变量逼近边界，最终停止。有限并不意味着步骤一定少。"},{"label":"反例：无终止条件","kind":"invalid","steps":["令 i = 0","条件恒为真，令 i = 1","条件仍为真，令 i = 2","截断展示：该规则没有终止条件"],"explanation":"这是不满足有穷性的过程。这里只展示有限条状态，不运行无限循环。"}]},{"id":"definite","name":"确定性","definition":"算法每一步都有明确的含义和执行规则。","examples":[{"label":"明确规则","kind":"valid","steps":["读取 x = 8","比较 x ≥ 5，得到真","返回“合格”"],"explanation":"阈值、比较和分支动作都明确。随机算法也可以有精确定义的随机规则，不能仅因使用随机数就判定其步骤含义不明确。"},{"label":"反例：模糊指令","kind":"invalid","steps":["读取 x = 8","要求“若 x 比较大，就适当调整”","无法确定阈值，也不知道如何调整"],"explanation":"“比较大”和“适当”没有精确定义，执行者无法唯一解释这条操作。"}]},{"id":"effective","name":"可行性","definition":"每一步都能通过有限次基本操作实现。","examples":[{"label":"可执行操作","kind":"valid","steps":["读取 a = 6、b = 3","执行整数加法 a + b","返回 9"],"explanation":"赋值、整数加法和返回都能用有限次基本操作实现。可行性不等于运行得足够快。"},{"label":"反例：除以零","kind":"invalid","steps":["读取 a = 6、b = 0","要求计算通常实数运算中的 a ÷ b","运算未定义，不能按这条规则得到实数结果"],"explanation":"在约定的实数运算范围内，除数为零没有定义。应先验证输入，或给出明确的错误处理分支。"}]},{"id":"input","name":"输入","definition":"算法可以有零个或多个输入。","examples":[{"label":"多个输入","kind":"valid","steps":["接收输入 a = 4、b = 7","计算 a + b","返回 11"],"explanation":"这里有两个外部输入。常量和中间变量不一定是外部输入。"},{"label":"零输入也正确","kind":"valid","steps":["不接收外部输入","令结果为常量 10","返回 10"],"explanation":"这是合法的零输入算法，不是反例。“没有输入就不是算法”是错误认识。"}]},{"id":"output","name":"输出","definition":"算法必须有一个或多个输出。","examples":[{"label":"返回计算结果","kind":"valid","steps":["接收输入 a = 4、b = 7","令局部变量 sum = a + b","返回 sum，调用者取得 11"],"explanation":"输出不只指打印。返回值、写入约定的结果位置或原地修改调用者可见的数据，都可以表达结果。"},{"label":"反例：丢弃结果","kind":"invalid","steps":["接收输入 a = 4、b = 7","仅在局部临时变量中计算 11","丢弃局部变量并结束，没有返回值或任何可观察的结果"],"explanation":"这里特意排除了返回、打印和可观察的状态变化，因此调用者没有获得处理结果。"}]}];
let state={feature:0,example:0,step:0};
const root=document.getElementById('demo');
function render(){const f=features[state.feature],e=f.examples[state.example];root.innerHTML=`<p class="eyebrow">点击特性 · 对照示例 · 逐步观察</p><div role="tablist" aria-label="算法基本特性" class="tabs">${features.map((f,i)=>`<button type="button" role="tab" id="tab-${i}" aria-controls="panel" aria-selected="${i===state.feature}" tabindex="${i===state.feature?0:-1}" data-feature="${i}">${f.name}</button>`).join('')}</div><div role="tabpanel" id="panel" aria-labelledby="tab-${state.feature}" tabindex="0"><p class="definition">${f.definition}</p><div class="examples" role="group" aria-label="选择对照示例">${f.examples.map((e,i)=>`<button type="button" data-example="${i}" aria-pressed="${i===state.example}">${e.label}</button>`).join('')}</div><ol class="steps">${e.steps.map((s,i)=>`<li ${i===state.step?'aria-current="step"':''} data-complete="${i<state.step}"><span aria-hidden="true">${i<state.step?'✓':i+1}</span><span>${s}</span></li>`).join('')}</ol><p class="progress" role="status" aria-live="polite">第 ${state.step+1} / ${e.steps.length} 步：${e.steps[state.step]}</p><div class="controls"><button data-action="back" ${state.step===0?'disabled':''}>上一步</button><button data-action="next" ${state.step===e.steps.length-1?'disabled':''}>下一步</button><button data-action="reset" ${state.step===0?'disabled':''}>重置</button></div><aside class="explanation" aria-label="常驻详解"><strong>${e.kind==='valid'?'为什么成立':'问题在哪里'}</strong><p>${e.explanation}</p></aside><p class="note">手动逐步演示，不会自动运行。用方向键切换特性，Tab 键移动到操作按钮。</p></div>`;}
root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;let focus;if(b.dataset.feature!==undefined){state={feature:Number(b.dataset.feature),example:0,step:0};focus='#tab-'+state.feature;}else if(b.dataset.example!==undefined){state.example=Number(b.dataset.example);state.step=0;focus='[data-example="'+state.example+'"]';}else{const last=features[state.feature].examples[state.example].steps.length-1;state.step=b.dataset.action==='reset'?0:Math.max(0,Math.min(last,state.step+(b.dataset.action==='next'?1:-1)));focus='[data-action="'+b.dataset.action+'"]';}render();const next=root.querySelector(focus);if(next&&!next.disabled)next.focus();else root.querySelector('#panel').focus();});
root.addEventListener('keydown',event=>{const tab=event.target.closest('[role="tab"]');if(!tab)return;const i=Number(tab.dataset.feature);const n=event.key==='ArrowRight'?(i+1)%5:event.key==='ArrowLeft'?(i+4)%5:event.key==='Home'?0:event.key==='End'?4:null;if(n===null)return;event.preventDefault();state={feature:n,example:0,step:0};render();document.getElementById('tab-'+n).focus();});render();</script></body></html>
